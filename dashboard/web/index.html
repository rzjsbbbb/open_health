<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%230d9488'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%23ffffff' stroke-width='4' opacity='.55'/%3E%3C/svg%3E" />
  <title>open_oura</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <span class="brand-copy">
          <span class="word">open_oura</span>
          <span class="brand-meta">本地健康观测站</span>
        </span>
      </div>
      <div class="actions">
        <span id="batt" class="batt" title="戒指电量"></span>
        <button id="sync-btn" class="action" title="通过蓝牙同步戒指">
          <span class="ic" style="--i:url(/icons/arrows-clockwise.svg)"></span>
          <span id="sync-label">同步</span>
        </button>
        <a id="dna-link" class="action" href="/dna" title="探索你的 DNA">
          <span class="ic" style="--i:url(/icons/dna.svg)"></span>
          <span>DNA</span>
        </a>
        <button id="profile-btn" class="action icon-only" title="编辑个人资料" aria-label="编辑个人资料">
          <span class="ic" style="--i:url(/icons/user.svg)"></span>
        </button>
      </div>
    </header>

    <section class="brief" aria-labelledby="brief-label">
      <span id="brief-label" class="brief-label">最新解读</span>
      <p id="digest" class="digest skeleton skeleton-text">&nbsp;</p>
    </section>

    <main class="dashboard-grid">
      <div class="dashboard-main">
        <section class="panel" id="day-panel">
          <div class="panel-head">
            <h2><span class="ic" style="--i:url(/icons/moon.svg)"></span>你的一天</h2>
            <div class="legend" id="sleep-legend" hidden>
              <span><i class="sw deep"></i>深睡</span>
              <span><i class="sw light"></i>浅睡</span>
              <span><i class="sw rem"></i>REM</span>
              <span><i class="sw wake"></i>清醒</span>
            </div>
          </div>
          <div id="day" class="day">
            <div class="skeleton skeleton-block"></div>
          </div>
        </section>

        <section class="tiles" id="tiles" aria-label="关键指标">
          <article class="tile skeleton"></article>
          <article class="tile skeleton"></article>
          <article class="tile skeleton"></article>
          <article class="tile skeleton"></article>
        </section>

        <div class="cols-2" id="clinical-grid">
          <section class="panel" id="cardio-panel">
            <div class="panel-head"><h2><span class="ic" style="--i:url(/icons/heartbeat.svg)"></span>心血管</h2></div>
            <div id="cardio" class="cardio-body"><div class="skeleton skeleton-block"></div></div>
          </section>

          <section class="panel" id="spo2-panel">
            <div class="panel-head"><h2><span class="ic" style="--i:url(/icons/wind.svg)"></span>血氧</h2></div>
            <div id="spo2" class="spo2-body"><div class="skeleton skeleton-block"></div></div>
          </section>
        </div>
      </div>

      <aside class="dashboard-side">
        <section class="panel" id="live-panel">
          <div class="panel-head">
            <h2><span class="ic" style="--i:url(/icons/heartbeat.svg)"></span>实时心率</h2>
            <button id="live-btn" class="action" title="从戒指实时读取一分钟心率">
              <span id="live-label">开始</span>
            </button>
          </div>
          <div class="live">
            <div class="live-now">
              <i id="live-dot" class="live-dot" aria-hidden="true"></i>
              <span id="live-bpm" class="live-bpm">—</span><span class="unit">bpm</span>
            </div>
            <div id="live-spark" class="spark"></div>
            <p id="live-status" class="live-status" aria-live="polite">戴上戒指,把手放在 Mac 附近,然后点「开始」。</p>
          </div>
        </section>

        <section class="panel" id="sleep-debt-panel">
          <div class="panel-head"><h2><span class="ic" style="--i:url(/icons/moon.svg)"></span>睡眠债</h2></div>
          <div id="sleep-debt" class="sleep-debt"><div class="skeleton skeleton-block"></div></div>
        </section>

        <section class="panel" id="illness-panel">
          <div class="panel-head"><h2><span class="ic" style="--i:url(/icons/heartbeat.svg)"></span>症状雷达</h2></div>
          <div id="illness" class="illness"><div class="skeleton skeleton-block"></div></div>
        </section>

        <section class="panel" id="device-panel">
          <div class="panel-head"><h2><span class="ic" style="--i:url(/icons/cpu.svg)"></span>设备与数据状态</h2></div>
          <div id="device" class="device"><div class="skeleton skeleton-block"></div></div>
        </section>

        <section class="panel" id="research-panel">
          <div class="panel-head"><h2><span class="ic" style="--i:url(/icons/cpu.svg)"></span>研究数据导出</h2></div>
          <form id="research-form" class="research">
            <p class="muted">把戒指原始数据导出为 CSV 文件(每次心跳或每 30 秒一行),使用校正后的时间。与 iOS 导出的文件相同。</p>
            <label for="rx-start">开始</label><input id="rx-start" type="datetime-local" required>
            <label for="rx-end">结束</label><input id="rx-end" type="datetime-local" required>
            <fieldset id="rx-streams"><legend>数据</legend>
              <label><input type="checkbox" value="rr_intervals" checked> 每次心跳(RR 间期)</label>
              <label><input type="checkbox" value="rr_quality"> 带质量标记的心跳</label>
              <label><input type="checkbox" value="sleep_movement_30s" checked> 睡眠期间的动作(30 秒)</label>
              <label><input type="checkbox" value="motion_30s" checked> 动作与姿势(30 秒)</label>
              <label><input type="checkbox" value="spo2_raw"> 血氧原始比值</label>
              <label><input type="checkbox" value="skin_temperature"> 皮肤温度</label>
            </fieldset>
            <button class="btn-primary" type="submit">下载 ZIP</button>
            <label for="rx-label">标记名称</label><input id="rx-label" type="text" maxlength="200" placeholder="例如:开始录音">
            <button class="btn-text" id="rx-mark" type="button">立即标记</button>
            <p id="rx-status" class="muted" role="status"></p>
          </form>
        </section>
      </aside>
    </main>

    <footer class="foot">
      <span>这里的一切都在本机计算,没有任何数据离开这台设备。</span>
      <span id="foot-meta"></span>
    </footer>
  </div>

  <!-- profile editor -->
  <dialog id="profile-dialog" class="dialog">
    <form id="profile-form" method="dialog">
      <h3>个人资料</h3>
      <p class="dialog-sub">戒指测不到这些信息。它们用来调整心血管年龄模型,只保存在本机。(戒指尺码不在戒指里,而是账户信息,对结果几乎没有影响,所以保留默认值。)</p>
      <div class="field-row">
        <div class="field">
          <label for="f-sex">出生性别</label>
          <select id="f-sex" name="sex">
            <option value="M">男</option>
            <option value="F">女</option>
            <option value="O">其他</option>
          </select>
        </div>
        <div class="field"><label for="f-age">年龄</label><input id="f-age" name="age" type="number" min="0" max="120" step="1" /></div>
      </div>
      <div class="field-row">
        <div class="field"><label for="f-height">身高(米)</label><input id="f-height" name="height_m" type="number" min="1" max="2.3" step="0.01" /></div>
        <div class="field"><label for="f-weight">体重(公斤)</label><input id="f-weight" name="weight_kg" type="number" min="20" max="250" step="1" /></div>
      </div>
      <div class="dialog-actions">
        <button type="button" id="profile-cancel" class="btn-text">取消</button>
        <button type="submit" id="profile-save" class="btn-primary">保存</button>
      </div>
    </form>
  </dialog>

  <!-- full-page sleep / activity report (shown over the dashboard) -->
  <div id="page" class="page" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
