<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%230d9488'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%23ffffff' stroke-width='4' opacity='.55'/%3E%3C/svg%3E" />
  <title>open_oura — DNA 探索</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/dna.css" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <span class="word">open_oura</span>
        <span class="dna-sub">DNA 探索</span>
      </div>
      <div class="actions">
        <a class="action" href="/" title="返回仪表盘">
          <span class="ic" style="--i:url(/icons/arrow-left.svg)"></span>
          <span>仪表盘</span>
        </a>
      </div>
    </header>

    <p class="digest" id="lede">
      用单 SNP 性状和多基因评分来解读你的基因组:可以用内置的示例评分,也可以用来自
      <a href="https://www.pgscatalog.org/" target="_blank" rel="noopener">PGS&nbsp;Catalog</a> 的真实评分。
      所有计算都在本机完成,你的基因组不会离开这台电脑。
    </p>

    <!-- controls: which genome + which scores -->
    <section class="panel" id="controls">
      <div class="dna-controls">
        <div class="dna-ctl">
          <label class="dna-ctl-label" for="file">基因组</label>
          <select id="file" class="dna-select" aria-label="基因组文件"></select>
          <span class="dna-hint" id="genome-dir"></span>
        </div>
        <div class="dna-ctl dna-ctl-grow">
          <div class="dna-ctl-label-row">
            <span class="dna-ctl-label">要计算的评分</span>
            <span class="dna-hint" id="scores-hint"></span>
          </div>
          <div id="score-picker" class="dna-picker"><div class="skeleton skeleton-text">&nbsp;</div></div>
          <form class="dna-add" id="add-form">
            <span class="ic" style="--i:url(/icons/flask.svg)"></span>
            <input id="pgs-id" type="text" placeholder="从 PGS Catalog 添加,例如 PGS000004" autocomplete="off" spellcheck="false" />
            <button class="btn-primary" id="add-btn" type="submit">获取</button>
          </form>
          <div id="add-status" class="dna-add-status"></div>
        </div>
      </div>
    </section>

    <section class="panel" id="search-panel">
      <div class="panel-head"><h2><span class="ic" style="--i:url(/icons/magnifying-glass.svg)"></span>查询变异位点</h2></div>
      <div class="dna-search">
        <input id="q" type="search" placeholder="rsID(rs4988235)或位置(chr2:135851076)…" autocomplete="off" spellcheck="false" />
        <button id="q-btn" class="btn-primary" type="button">搜索</button>
      </div>
      <div id="q-result" class="dna-lookup"></div>
    </section>

    <section class="panel" id="scores-panel">
      <div class="panel-head">
        <h2><span class="ic" style="--i:url(/icons/flask.svg)"></span>多基因评分</h2>
        <span class="dna-caveat-tag" title="原始多基因总分只有对照祖源匹配的参考人群才能换算成百分位,而这里没有附带参考人群。">原始分数 · 无人群参考</span>
      </div>
      <div id="scores" class="dna-scores"><div class="skeleton skeleton-block"></div></div>
    </section>

    <section class="panel" id="traits-panel">
      <div class="panel-head">
        <h2><span class="ic" style="--i:url(/icons/dna.svg)"></span>性状</h2>
        <div class="legend">
          <span><i class="sw" style="background:var(--good)"></i>值得一提</span>
          <span><i class="sw" style="background:var(--warn)"></i>需要留意</span>
          <span><i class="sw" style="background:var(--faint)"></i>中性</span>
        </div>
      </div>
      <div id="traits" class="dna-traits"><div class="skeleton skeleton-block"></div></div>
    </section>

    <footer class="foot">
      <span>仅供学习,不构成医疗建议。坐标基于 <span id="build">GRCh38</span>;优先按 rsID 匹配,其次按染色体:位置。PGS 评分使用严格的效应 / 非效应等位基因匹配。</span>
      <span id="foot-meta"></span>
    </footer>
  </div>

  <script src="/dna.js"></script>
</body>
</html>
